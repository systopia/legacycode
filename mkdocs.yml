site_name: CiviCRM Legacy Code
site_description: Provides in-line replacements for deprecated and abandoned CiviCRM Core functions
site_author: SYSTOPIA
repo_url: https://github.com/systopia/legacycode/blob/master/README.md

theme:
  name: material

nav:
  - Introduction: index.md

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.mark

plugins:
  - search:
      lang: en
